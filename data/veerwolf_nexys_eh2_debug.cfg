# SPDX-License-Identifier: Apache-2.0
# OpenOCD 0.12 configuration for dual-hart VeeR EH2 1.4 on
# Nexys A7 / Nexys 4 DDR using an external FT232H MPSSE adapter.
#
# FT232H ADBUS0 (TCK) -> Pmod JC1
# FT232H ADBUS1 (TDI) -> Pmod JC2
# FT232H ADBUS2 (TDO) <- Pmod JC3
# FT232H ADBUS3 (TMS) -> Pmod JC4
# FT232H GND           -> Nexys GND

adapter driver ftdi
adapter usb vid_pid 0x0403 0x6014
ftdi channel 0

# Only ADBUS0, ADBUS1 and ADBUS3 are outputs. ADBUS2 is TDO input.
# Unused ADBUS/ACBUS GPIO remain inputs; no nTRST or nSRST is connected.
ftdi layout_init 0x0008 0x000b

reset_config none
adapter speed 4000
transport select jtag

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001

if {![info exists EH2_START_HART1]} {
    set EH2_START_HART1 0
}

set _TARGETNAME_0 $_CHIPNAME.cpu0
set _TARGETNAME_1 $_CHIPNAME.cpu1
target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -coreid 0
set _TARGETS [list $_TARGETNAME_0]

# Do not create a deferred hart-1 target in the normal single-hart session.
# OpenOCD's global "reset halt" command resets every defined target, including
# deferred targets, and an unstarted EH2 hart has no identified DTM version yet.
if {$EH2_START_HART1} {
    target create $_TARGETNAME_1 riscv -chain-position $_CHIPNAME.cpu -coreid 1 -defer-examine
    lappend _TARGETS $_TARGETNAME_1
}

foreach t $_TARGETS {
    targets $t

    # This EH2 debug implementation accesses ICCM/DCCM through abstract
    # commands. Do not let OpenOCD fall back to SBA or progbuf.
    riscv virt2phys_mode off
    riscv set_mem_access abstract
    riscv autofence off

    # EH2 custom CSRs used by the WD firmware/debug flow. OpenOCD creates
    # numeric names such as csr1988 (DMST) and csr2044 (MHARTSTART).
    riscv expose_csrs 1984-1998,2000,2002-2007,2032-2034,2040-2041,2044-2045,2047,3008,3016-3020,4032,4036,4040
}

proc veer_eh2_execute_fence {tgt} {
    set previous_target [target current]
    targets $tgt
    if {[string equal [$tgt curstate] "halted"]} {
        reg csr1988 0x3
    }
    targets $previous_target
}

$_TARGETNAME_0 configure -event resume-start {
    veer_eh2_execute_fence $_TARGETNAME_0
}
$_TARGETNAME_0 configure -event step-start {
    veer_eh2_execute_fence $_TARGETNAME_0
}
if {$EH2_START_HART1} {
    $_TARGETNAME_1 configure -event resume-start {
        veer_eh2_execute_fence $_TARGETNAME_1
    }
    $_TARGETNAME_1 configure -event step-start {
        veer_eh2_execute_fence $_TARGETNAME_1
    }
}

targets $_TARGETNAME_0
init
halt

# Hart 1 is held unavailable until firmware or the debug host writes
# MHARTSTART.  This procedure is used only when EH2_START_HART1 created the
# deferred hart-1 debugger target during OpenOCD's configuration stage.
proc veer_eh2_start_hart1 {} {
    global _TARGETNAME_0 _TARGETNAME_1

    targets $_TARGETNAME_0
    halt
    # MHARTSTART.start1 is bit 1.  Bit 0 is the read-only hart0 status.
    reg csr2044 0x2
    sleep 10

    $_TARGETNAME_1 arp_examine
    targets $_TARGETNAME_1
    halt
    target smp $_TARGETNAME_0 $_TARGETNAME_1
    targets $_TARGETNAME_0
}

# Optional dual-hart session:
# openocd -c "set EH2_START_HART1 1" -f veerwolf_nexys_eh2_debug.cfg
if {$EH2_START_HART1} {
    veer_eh2_start_hart1
}
