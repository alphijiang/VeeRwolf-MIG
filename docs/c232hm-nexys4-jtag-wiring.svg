<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">C232HM-DDHSL-0 to Nexys 4 DDR Pmod JC JTAG wiring</title>
  <desc id="desc">Wiring diagram showing FTDI orange TCK to JC1, yellow TDI to JC2, green TDO from JC3, brown TMS to JC4, and black ground to JC5. The red power lead is not connected.</desc>
  <defs>
    <marker id="arrowRight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#243447"/>
    </marker>
    <marker id="arrowLeft" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M12,0 L0,6 L12,12 z" fill="#243447"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #14213d; }
      .subtitle { font: 17px system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 21px system-ui, sans-serif; fill: #14213d; }
      .label { font: 600 17px system-ui, sans-serif; fill: #172033; }
      .small { font: 15px system-ui, sans-serif; fill: #475569; }
      .pin { font: 700 14px ui-monospace, monospace; fill: #172033; text-anchor: middle; }
      .note { font: 600 16px system-ui, sans-serif; fill: #7f1d1d; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .wire { fill: none; stroke-width: 8; stroke-linecap: round; }
      .direction { fill: none; stroke: #243447; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" class="title" text-anchor="middle">External EH2 JTAG wiring</text>
  <text x="600" y="78" class="subtitle" text-anchor="middle">FTDI C232HM-DDHSL-0 (3.3 V) → Nexys A7-100T / Nexys 4 DDR Pmod JC</text>

  <rect x="40" y="112" width="300" height="468" rx="18" class="box"/>
  <text x="190" y="150" class="heading" text-anchor="middle">C232HM-DDHSL-0</text>
  <text x="190" y="177" class="small" text-anchor="middle">FT232H MPSSE cable</text>

  <g>
    <circle cx="92" cy="226" r="13" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
    <text x="122" y="232" class="label">Pin 2 · Orange · TCK</text>
    <circle cx="92" cy="296" r="13" fill="#facc15" stroke="#a16207" stroke-width="2"/>
    <text x="122" y="302" class="label">Pin 3 · Yellow · TDI</text>
    <circle cx="92" cy="366" r="13" fill="#22c55e" stroke="#166534" stroke-width="2"/>
    <text x="122" y="372" class="label">Pin 4 · Green · TDO</text>
    <circle cx="92" cy="436" r="13" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <text x="122" y="442" class="label">Pin 5 · Brown · TMS</text>
    <circle cx="92" cy="506" r="13" fill="#111827" stroke="#000000" stroke-width="2"/>
    <text x="122" y="512" class="label">Pin 10 · Black · GND</text>
  </g>

  <rect x="860" y="112" width="300" height="468" rx="18" class="box"/>
  <text x="1010" y="150" class="heading" text-anchor="middle">Nexys Pmod JC</text>
  <text x="1010" y="177" class="small" text-anchor="middle">Top view; use the PCB pin-1 mark</text>

  <g transform="translate(885 205)">
    <rect x="0" y="0" width="250" height="176" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <path d="M0 20 L20 0" stroke="#ef4444" stroke-width="5"/>
    <g>
      <circle cx="28" cy="50" r="18" fill="#fff" stroke="#334155" stroke-width="2"/>
      <circle cx="67" cy="50" r="18" fill="#fff" stroke="#334155" stroke-width="2"/>
      <circle cx="106" cy="50" r="18" fill="#fff" stroke="#334155" stroke-width="2"/>
      <circle cx="145" cy="50" r="18" fill="#fff" stroke="#334155" stroke-width="2"/>
      <circle cx="184" cy="50" r="18" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
      <circle cx="223" cy="50" r="18" fill="#fecaca" stroke="#334155" stroke-width="2"/>
      <text x="28" y="55" class="pin">1</text><text x="67" y="55" class="pin">2</text>
      <text x="106" y="55" class="pin">3</text><text x="145" y="55" class="pin">4</text>
      <text x="184" y="55" class="pin">5</text><text x="223" y="55" class="pin">6</text>
      <circle cx="28" cy="126" r="18" fill="#fff" stroke="#334155" stroke-width="2"/>
      <circle cx="67" cy="126" r="18" fill="#fff" stroke="#334155" stroke-width="2"/>
      <circle cx="106" cy="126" r="18" fill="#fff" stroke="#334155" stroke-width="2"/>
      <circle cx="145" cy="126" r="18" fill="#fff" stroke="#334155" stroke-width="2"/>
      <circle cx="184" cy="126" r="18" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
      <circle cx="223" cy="126" r="18" fill="#fecaca" stroke="#334155" stroke-width="2"/>
      <text x="28" y="131" class="pin">7</text><text x="67" y="131" class="pin">8</text>
      <text x="106" y="131" class="pin">9</text><text x="145" y="131" class="pin">10</text>
      <text x="184" y="131" class="pin">11</text><text x="223" y="131" class="pin">12</text>
    </g>
  </g>

  <text x="913" y="411" class="pin">JC1</text>
  <text x="952" y="411" class="pin">JC2</text>
  <text x="991" y="411" class="pin">JC3</text>
  <text x="1030" y="411" class="pin">JC4</text>
  <text x="1069" y="411" class="pin">GND</text>
  <text x="1108" y="411" class="pin">3V3</text>
  <text x="913" y="440" class="small" text-anchor="middle">TCK</text>
  <text x="952" y="440" class="small" text-anchor="middle">TDI</text>
  <text x="991" y="440" class="small" text-anchor="middle">TDO</text>
  <text x="1030" y="440" class="small" text-anchor="middle">TMS</text>

  <path d="M340 226 C510 226 675 226 913 255" class="wire" stroke="#f97316"/>
  <path d="M340 296 C520 296 690 290 952 255" class="wire" stroke="#facc15"/>
  <path d="M340 366 C530 366 700 350 991 255" class="wire" stroke="#22c55e"/>
  <path d="M340 436 C540 436 720 410 1030 255" class="wire" stroke="#92400e"/>
  <path d="M340 506 C560 506 770 450 1069 255" class="wire" stroke="#111827"/>

  <path d="M485 210 L690 210" class="direction" marker-end="url(#arrowRight)"/>
  <text x="588" y="197" class="small" text-anchor="middle">FTDI drives FPGA</text>
  <path d="M690 342 L485 342" class="direction" marker-end="url(#arrowLeft)"/>
  <text x="588" y="330" class="small" text-anchor="middle">FPGA drives FTDI</text>

  <rect x="40" y="612" width="1120" height="76" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="65" y="642" class="note">Power safety:</text>
  <text x="225" y="642" class="small">Power the Nexys board normally. Leave FTDI pin 1 / red 3.3 V lead disconnected.</text>
  <text x="65" y="671" class="small">Connect only one black GND lead to JC5 or JC11. Grey, purple, white and blue GPIO leads are unused.</text>
</svg>
